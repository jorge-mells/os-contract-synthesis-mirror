version: "3.7"

services:
  yosys:
    container_name: yosys
    build: .
    # image: gdnmhr/contractgen:latest
    userns_mode: "keep-id:uid=1002,gid=1002"
    volumes:
      - .:/home/yosys/resources:Z
      # NOTE: temporary!!
      - ../../../../george-mills:/home/yosys/resources/os:Z
      # end temporary!!
      - ../../..:/home/yosys/project:Z
    # entrypoint: /bin/bash
    # entrypoint: /home/yosys/resources/run.sh
    # NOTE: temporary!
    stdin_open: true
    tty: true
    cap_add:
      - SYS_PTRACE
